# Stage 4 (generate): teacher rollouts on GitHub-hosted runners, one job per shard, merged at the end.
#
# The teacher model runs on OpenRouter, so the runner only hosts the task containers: the agent's
# own container (each task's image, network off) and a fresh container that runs the task's tests
# on the teacher's patch. Each shard takes every N-th task in rank order and aims for 1/N of the
# solved target; the merge applies the global per-source / per-repo limits.
#
# First run: num_shards=1, limit=10 -> 10 tasks, then read the report (cost, solve rate, reasoning).
#
# Needs (Settings -> Secrets and variables -> Actions):
#   secrets   OPENROUTER_API_KEY,
#             KAGGLE_USERNAME + KAGGLE_KEY, or KAGGLE_API_TOKEN (the harness wheels come from the organizers' public
#               Kaggle dataset metric/gemma-4-developer-agent-wheelhouse, never from this repo),
#             DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (optional, avoids pull limits)
#   optional  variable HARNESS_REPO + secret HARNESS_TOKEN: take the harness from a private repo instead
# Task files: data/gen/part-*.jsonl (valid tasks, rank order) and data/targets.json, see README.
# Progress is kept automatically on the `gen-ledger` branch (codeagent_data/generate/ledger.py):
# every run reads it first and never starts a task that already has a finished attempt (solved or
# not); only tasks whose attempt ended in an infrastructure/API error (e.g. credit ran out) are
# tried again. The merge job adds each run's results to it, also after a cancel or a timeout.
# Solved traces are stored there too, so nothing depends on artifacts that expire.

name: generate-trajectories

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Valid task files (shell glob)"
        default: "data/gen/*.jsonl"
      num_shards:
        description: "Parallel jobs (first test: 1; full run: 20)"
        default: "1"
      limit:
        description: "Max new attempts per job (first test: 10; 0 = until the target or max_minutes)"
        default: "10"
      workers:
        description: "Tasks per job in parallel (they mostly wait on the API)"
        default: "4"
      max_minutes:
        description: "Stop starting new tasks after N minutes (jobs are killed at 360)"
        default: "290"
      model:
        description: "OpenRouter model id"
        default: "moonshotai/kimi-k3"
      reasoning_effort:
        description: "low | medium | high | none (= the model's default)"
        default: "high"
      extra_body:
        description: 'JSON added to every request, e.g. {"provider": {"sort": "price"}}'
        default: ""
      prices:
        description: "USD per 1M tokens 'input output cached' (for the cost estimate only)"
        default: "0 0 0"
      time_minutes:
        description: "Agent time budget per task (minutes)"
        default: "45"

# one run at a time: runs share the ledger branch
concurrency:
  group: generate-trajectories
  cancel-in-progress: false

env:
  # extra results of earlier runs committed by hand (optional; the gen-ledger branch is read anyway)
  PRIOR: data/gen_done.jsonl
  # tries per task until it is solved (each try is a new sample; a second try is only spent when
  # the first got somewhere: half the F2P tests pass, or it edited a file of the reference fix)
  ATTEMPTS: "2"
  # skip tasks whose reference fix is larger than this (0 = no limit); set after the pilot report's
  # "solve rate by size" table shows where solving stops paying off
  MAX_GOLD_LINES: "0"
  MAX_GOLD_FILES: "0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        env:
          N: ${{ inputs.num_shards }}
        run: python3 -c "import json, os; print('shards=' + json.dumps(list(range(int(os.environ['N'])))))" >> "$GITHUB_OUTPUT"

  generate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      HARNESS_REPO: ${{ vars.HARNESS_REPO }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Read the ledger (tasks already done in earlier runs)
        run: |
          if git fetch -q --depth 1 origin gen-ledger; then
            git show FETCH_HEAD:results.jsonl > ledger_prior.jsonl
            echo "ledger: $(wc -l < ledger_prior.jsonl) earlier attempts"
          else
            echo "no ledger yet (first run)"; : > ledger_prior.jsonl
          fi

      - name: Fetch the harness (private repo)
        if: env.HARNESS_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HARNESS_REPO }}
          token: ${{ secrets.HARNESS_TOKEN }}
          path: harness_src
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements-generate.txt

      - name: Fetch the harness wheels (organizers' Kaggle dataset)
        if: env.HARNESS_REPO == ''
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          # either a legacy kaggle.json (username + key) or a new API token; drop the unset one
          [ -n "$KAGGLE_API_TOKEN" ] || unset KAGGLE_API_TOKEN
          [ -n "$KAGGLE_USERNAME" ] || unset KAGGLE_USERNAME KAGGLE_KEY
          pip install -q kaggle
          python scripts/fetch_harness.py harness_src

      - name: Install the harness
        run: |
          bash scripts/setup_harness.sh harness_src harness
          rm -rf harness_src

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate shard ${{ matrix.shard }}
        env:
          PYTHONPATH: harness
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SHARD: ${{ matrix.shard }}
          N: ${{ inputs.num_shards }}
          TASKS: ${{ inputs.tasks }}
          LIMIT: ${{ inputs.limit }}
          WORKERS: ${{ inputs.workers }}
          MAX_MIN: ${{ inputs.max_minutes }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.reasoning_effort }}
          EXTRA: ${{ inputs.extra_body }}
          PRICES: ${{ inputs.prices }}
          TIME_MIN: ${{ inputs.time_minutes }}
        run: |
          read -r P_IN P_OUT P_CACHED <<< "$PRICES"
          targets=(); [ -f data/targets.json ] && targets=(--targets data/targets.json)
          effort=(); [ -n "$EFFORT" ] && effort=(--reasoning-effort "$EFFORT")
          # $TASKS is a glob on purpose: let the shell expand it
          python -m codeagent_data generate $TASKS "${targets[@]}" "${effort[@]}" \
            --shard "$SHARD/$N" --out "out/shard_$SHARD" --prior "$PRIOR" ledger_prior.jsonl \
            --workers "$WORKERS" --limit "$LIMIT" --max-minutes "$MAX_MIN" --prune-images \
            --model "$MODEL" --extra-body "$EXTRA" --time-minutes "$TIME_MIN" --attempts "$ATTEMPTS" \
            --max-gold-lines "$MAX_GOLD_LINES" --max-gold-files "$MAX_GOLD_FILES" \
            --price-in "${P_IN:-0}" --price-out "${P_OUT:-0}" --price-cached "${P_CACHED:-0}"
          cat "out/shard_$SHARD/generation_report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gen-shard-${{ matrix.shard }}
          path: out/shard_${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 30

  merge:
    needs: generate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the ledger branch
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: gen-shard-*
          path: shards
      - name: Open the ledger branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir ledger && cd ledger && git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin gen-ledger; then
            git checkout -q -b gen-ledger FETCH_HEAD
          else
            git checkout -q --orphan gen-ledger
          fi
      - name: Add this run to the ledger and merge under the global limits
        env:
          TASKS: ${{ inputs.tasks }}
        run: |
          prev=(); [ -f "$PRIOR" ] && prev=("$PRIOR")
          python -m codeagent_data ledger-update --ledger ledger --results "${prev[@]}" shards/*/results.jsonl
          targets=(); [ -f data/targets.json ] && targets=(--targets data/targets.json)
          python -m codeagent_data generate-merge --tasks $TASKS "${targets[@]}" \
            --results ledger/results.jsonl --out out/generated
          cp out/generated/generation_report.md ledger/report.md
          cat ledger/README.md out/generated/generation_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the ledger
        run: |
          cd ledger
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "ledger: run ${GITHUB_RUN_ID}"
          git push -q origin gen-ledger
      - uses: actions/upload-artifact@v4
        with:
          name: generated
          path: out/generated
          retention-days: 90
