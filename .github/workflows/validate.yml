# Stage 1 (validate) on GitHub-hosted runners: one job per shard, merged at the end.
#
# Why here: the runners sit in a datacenter (fast image pulls), have Docker, and on a PUBLIC
# repository each job gets 4 CPUs / 16 GB RAM for free. Jobs are limited to 6 hours, so each
# shard stops starting new tasks after --max-minutes and you simply re-run the workflow with
# the merged verdicts to continue (finished tasks are skipped, failed pulls are retried).
#
# Step-by-step instructions: README.md, section "validate on GitHub Actions".
# Task files: data/pilot/part-*.jsonl and data/full/part-*.jsonl, written by scripts/make_task_files.py.
# Secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Settings -> Secrets and variables -> Actions).
# To continue after a run: download the `stage1` artifact, commit its verdicts_merged.jsonl as
# data/verdicts_done.jsonl, and run the workflow again.

name: validate-tasks

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Task files to validate (shell glob): data/pilot/*.jsonl or data/full/*.jsonl"
        default: "data/pilot/*.jsonl"
      num_shards:
        description: "Number of parallel jobs (pilot: 10, full run: 40)"
        default: "10"
      workers:
        description: "Tasks per job in parallel (4-CPU runner: 2)"
        default: "2"
      max_minutes:
        description: "Stop starting new tasks after N minutes (jobs are killed at 360)"
        default: "270"
      skip_done:
        description: "Verdicts from earlier runs to skip (missing file is fine)"
        default: "data/verdicts_done.jsonl"
      limit:
        description: "Max tasks per shard (0 = all); use 3 for a quick smoke test"
        default: "0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        env:
          N: ${{ inputs.num_shards }}
        run: python3 -c "import json, os; print('shards=' + json.dumps(list(range(int(os.environ['N'])))))" >> "$GITHUB_OUTPUT"

  validate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space (images need room; the runner has ~14 GB free by default)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
          N: ${{ inputs.num_shards }}
          WORKERS: ${{ inputs.workers }}
          MAX_MIN: ${{ inputs.max_minutes }}
          SKIP: ${{ inputs.skip_done }}
          LIMIT: ${{ inputs.limit }}
          TASKS: ${{ inputs.tasks }}
        run: |
          # $TASKS is a glob on purpose: let the shell expand it
          python -m codeagent_data validate $TASKS \
            --shard "$SHARD/$N" --out "out/shard_$SHARD" \
            --workers "$WORKERS" --cpus 2 --mem 6g --timeout 1200 \
            --prune-images --max-minutes "$MAX_MIN" --limit "$LIMIT" \
            --skip-done "$SKIP"

      - name: Keep only the logs of failed tasks (artifact size)
        if: always()
        run: |
          python3 - <<'EOF'
          import json, pathlib, os
          out = pathlib.Path(f"out/shard_{os.environ['SHARD']}")
          vf = out / "verdicts.jsonl"
          ok = {json.loads(l)["instance_id"].replace("/", "_") for l in vf.read_text().splitlines()
                if l.strip() and json.loads(l)["valid"]} if vf.exists() else set()
          for log in (out / "logs").glob("*.log") if (out / "logs").exists() else []:
              if log.name.split(".base.log")[0].split(".gold")[0] in ok:
                  log.unlink()
          EOF
        env:
          SHARD: ${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: out/shard_${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 14

  merge:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Merge shards (+ earlier runs)
        env:
          TASKS: ${{ inputs.tasks }}
          SKIP: ${{ inputs.skip_done }}
        run: |
          prev=""; [ -f "$SKIP" ] && prev="$SKIP"
          python -m codeagent_data merge --tasks $TASKS \
            --verdicts $prev shards/*/verdicts.jsonl --out out/stage1
          cat out/stage1/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: stage1
          path: |
            out/stage1/valid_tasks.jsonl
            out/stage1/verdicts_merged.jsonl
            out/stage1/report.md
