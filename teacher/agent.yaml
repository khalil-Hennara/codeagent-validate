# Teacher agent for trajectory generation. Same tools and limits as the Gemma competition agent;
# `model: teacher` is bound at runtime to the OpenRouter model given on the command line.
name: teacher
model: teacher
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - submit_patch
  - get_status
generate_content_config:
  temperature: 1.0
  max_output_tokens: 32768
